name: Publish to Maven Central

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# 需要在仓库 Settings → Secrets and variables → Actions 里配置四个 secret：
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD  central.sonatype.com → View Account → Generate User Token
#   GPG_PRIVATE_KEY                                  gpg --armor --export-secret-keys <KEY_ID> 的完整输出
#   GPG_PASSPHRASE                                   上面私钥的口令
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # setup-java 会生成 settings.xml（server id=central，凭证取自下面同名环境变量），
      # 并把私钥导入 runner 的 gpg keyring；maven-gpg-plugin 从 MAVEN_GPG_PASSPHRASE 读口令。
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Build and test
        run: mvn -B verify

      - name: Deploy to Maven Central
        run: mvn -B deploy -P central -DskipTests
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
